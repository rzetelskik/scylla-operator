name: Push image

# Pushes the OCI archive artifact of _image.yaml to a repository under the given tags, unchanged, so the image has the
# same digest wherever it's pushed. Outputs a digest-pinned reference to it.
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the artifact holding the OCI archive, as `_image.yaml` outputs it.
        required: true
        type: string
      image-repo-ref:
        description: Repository to push to, including the registry, e.g. `quay.io/scylladb-dev/ci`.
        required: true
        type: string
      image-tags:
        description: JSON list of the tags to push the image under, e.g. `["1.23.0", "1.23", "latest"]`.
        required: true
        type: string
    outputs:
      image-ref:
        description: Digest-pinned reference to the pushed image.
        value: ${{ jobs.push.outputs.image-ref }}
    secrets:
      registry-auth-json:
        description: Contents of a containers-auth.json(5) file with push access to the repository.
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  push:
    runs-on: hosted-runners-standard-pool
    container:
      image: quay.io/scylladb/scylla-operator-images:kube-tools
    timeout-minutes: 30
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
    steps:
    - name: Download the image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}

    - name: Write registry auth file
      env:
        REGISTRY_AUTH_JSON: ${{ secrets.registry-auth-json }}
      run: |
        set -euo pipefail
        shopt -s inherit_errexit

        if [[ -z "${REGISTRY_AUTH_JSON}" ]]; then
          echo '::error::The registry auth is empty. GitHub does not pass secrets to runs of pull requests from forks. If this is a pull request from a fork, this is expected and needs no action from you: a maintainer will run the e2e suites for it.'
          exit 1
        fi

        umask 077
        printf '%s' "${REGISTRY_AUTH_JSON}" > "${RUNNER_TEMP}/auth.json"
        echo "REGISTRY_AUTH_FILE=${RUNNER_TEMP}/auth.json" >> "${GITHUB_ENV}"

    # --preserve-digests fails the copy rather than letting skopeo rewrite a manifest into a different digest.
    - name: Push
      id: push
      env:
        IMAGE_REPO_REF: ${{ inputs.image-repo-ref }}
        IMAGE_TAGS: ${{ inputs.image-tags }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        archive="oci-archive:${RUNNER_TEMP}/image.tar"
        for image_tag in $( jq -r '.[]' <<< "${IMAGE_TAGS}" ); do
          skopeo copy --all --preserve-digests "${archive}" "docker://${IMAGE_REPO_REF}:${image_tag}"
        done

        digest="$( skopeo inspect --raw "${archive}" | sha256sum | cut -d ' ' -f 1 )"
        echo "image-ref=${IMAGE_REPO_REF}@sha256:${digest}" >> "${GITHUB_OUTPUT}"
