name: "Tests (targeted)"

# Runs the selected tests from `_cluster-tests.yaml` against the dispatched ref, e.g. the ones too expensive to run on
# every PR. Dispatching it on a PR's head branch, e.g. `gh workflow run tests-targeted.yaml --ref <branch> -f
# tests='["oke-*"]'`, tests the PR's head commit. A dispatched run's checks don't show on the PR, so the run reports its
# result as a commit status named after the workflow on the commit it tests, which does.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          JSON list of glob patterns matching the ids of the tests in `_cluster-tests.yaml` to run, e.g. `["oke-*",
          "openshift-preflight"]`.
        required: true
        type: string

run-name: "Tests (targeted) ${{ inputs.tests }} on ${{ github.ref_name }}"

# There is a single status per commit, so a new run cancels the one before it on the same ref rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  report-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Report the run as pending
      uses: ./.github/actions/set-commit-status
      with:
        context: ${{ github.workflow }}
        state: pending
        description: Running ${{ inputs.tests }}

  # DROP: stubs of the image, OLM and test jobs, so only the status reporting is real. A selection containing "fail"
  # fails the tests.
  image:
    runs-on: ubuntu-latest
    steps:
    - run: sleep 30

  olm:
    needs: image
    runs-on: ubuntu-latest
    steps:
    - run: sleep 30

  tests:
    needs:
    - image
    - olm
    runs-on: ubuntu-latest
    env:
      TESTS: ${{ inputs.tests }}
    steps:
    - run: |
        sleep 60
        [[ "${TESTS}" != *fail* ]]

  # A run cancelled by the next one on the same ref leaves the status to that run. A run cancelled by hand stays pending
  # until it's dispatched again.
  report-result:
    needs:
    - report-pending
    - image
    - olm
    - tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Determine the result of the run
      id: result
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        # Only a run whose every job succeeded passes, so a result this doesn't expect fails it.
        state=failure
        verb=Failed
        if jq -e 'all(.[]; .result == "success")' <<< "${NEEDS}" > /dev/null; then
          state=success
          verb=Passed
        fi
        {
          echo "state=${state}"
          echo "verb=${verb}"
        } >> "${GITHUB_OUTPUT}"

    - name: Report the result of the run
      uses: ./.github/actions/set-commit-status
      with:
        context: ${{ github.workflow }}
        state: ${{ steps.result.outputs.state }}
        description: ${{ steps.result.outputs.verb }} ${{ inputs.tests }}
