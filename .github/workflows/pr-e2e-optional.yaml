name: "PR: optional E2E"

# Runs the e2e suites that are too expensive to run on every PR. Labelling a PR `e2e/<job>` runs that job from
# _e2e-jobs.yaml, and from then on every push to the PR reruns it. The suites are informational: nothing requires them
# to merge. This is a separate workflow from pr.yaml, so that a label event doesn't restart the suites that always run.
on:
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
    - id: plan
      env:
        ACTION: ${{ github.event.action }}
        LABEL: ${{ github.event.label.name }}
        LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        LABEL_PREFIX: e2e/
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        # A label starts only its own job, so that labelling a PR leaves the jobs already running on it alone. A new
        # commit reruns all the labelled ones.
        case "${ACTION}" in
        labeled)
          jobs="$( jq -cn --arg label "${LABEL}" '[$label | select(startswith(env.LABEL_PREFIX)) | ltrimstr(env.LABEL_PREFIX)]' )"
          ;;
        *)
          jobs="$( jq -c '[.[] | select(startswith(env.LABEL_PREFIX)) | ltrimstr(env.LABEL_PREFIX)]' <<< "${LABELS}" )"
          ;;
        esac
        echo "jobs=${jobs}" >> "${GITHUB_OUTPUT}"

  e2e:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    uses: ./.github/workflows/_e2e-jobs.yaml
    with:
      jobs: ${{ needs.plan.outputs.jobs }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}
