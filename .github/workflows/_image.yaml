name: Image

# Builds the operator image from the checked out ref, natively on amd64 and arm64 runners, and uploads it as an
# artifact holding a multi-arch OCI archive. Callers push it with _push-image.yaml.
on:
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the artifact holding the OCI archive.
        value: image

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: hosted-runners-standard-pool
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/${{ matrix.arch }}
        labels: org.opencontainers.image.revision=${{ github.sha }}
        outputs: type=oci,dest=${{ runner.temp }}/image,tar=false
        # The slow layer is the build in the builder stage, which only mode=max exports. The legs build different layers,
        # so each needs a scope of its own. A failure to export the cache shouldn't fail the image.
        cache-from: type=gha,scope=image-${{ matrix.arch }}
        cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max,ignore-error=true

    - name: Upload the image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: image-${{ matrix.arch }}
        path: ${{ runner.temp }}/image
        if-no-files-found: error
        retention-days: 1
        # A re-run of a build leg replaces the image the earlier attempt left behind.
        overwrite: true

  manifest:
    needs: build
    runs-on: hosted-runners-standard-pool
    container:
      image: quay.io/scylladb/scylla-operator-images:kube-tools
    timeout-minutes: 10
    steps:
    - name: Download the images
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ${{ runner.temp }}/images
        pattern: image-*

    # --all keeps each image's attestation next to it.
    - name: Create the manifest list
      env:
        # podman's default overlay storage needs mount privileges the job's container doesn't have.
        STORAGE_DRIVER: vfs
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        podman manifest create image
        for arch in amd64 arm64; do
          podman manifest add --all image "oci:${RUNNER_TEMP}/images/image-${arch}"
        done
        podman manifest push --all image "oci-archive:${RUNNER_TEMP}/image.tar"

        # A list missing an architecture would only surface once the pods crash-loop on its nodes.
        manifest="$( podman manifest inspect image )"
        for arch in amd64 arm64; do
          jq -e --arg arch "${arch}" 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $arch)' <<< "${manifest}"
        done

    - name: Upload the image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: image
        path: ${{ runner.temp }}/image.tar
        if-no-files-found: error
        retention-days: 7
        overwrite: true
