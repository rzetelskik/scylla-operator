name: Certify OLM bundle

# Submits the OLM bundle of a release tag to the Red Hat certification pipeline. The release workflow calls it after
# publishing, which is the only path that submits. A dispatch is a dry run: the bundle is pushed to the
# certified-operators fork and the pipeline runs without opening the upstream PR. Either way the workflow file and the
# certification scripts come from `github.sha` and the bundle from the tag, so fixed tooling applies to an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to certify, e.g. `v1.20.1` or `v1.20.1-rc.1`.
        required: true
        type: string
      submit:
        description: Open the PR in redhat-openshift-ecosystem/certified-operators.
        required: false
        default: false
        type: boolean
  # The triggers keep separate input blocks by design, so `tag` is mirrored here; both feed the same `inputs` context.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to certify, e.g. `v1.20.1` or `v1.20.1-rc.1`.
        required: true
        type: string
      target-branch:
        description: Branch to push to in the certified-operators fork. Defaults to scylladb-operator-<version>-dry-run.
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

# See _ci-jobs.yaml: the container image declares no USER, so git needs safe.directory for the checkout.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  certify:
    name: certify
    runs-on: hosted-runners-standard-pool
    container:
      image: quay.io/scylladb/scylla-operator-images:kube-tools
    timeout-minutes: 180

    steps:
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: release
          # postprocess-bundle.sh lists the release tags to compute spec.replaces, and a shallow checkout has none.
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      # The repository secrets are read by name, so that a dispatch sees them too. The caller has to inherit them.
      - name: Materialize the credentials
        id: credentials
        env:
          CLUSTER_KUBECONFIG: ${{ secrets.OPENSHIFT_CERTIFICATION_CLUSTER_KUBECONFIG }}
          CD_BOT_SSH_KEY: ${{ secrets.SCYLLADB_OPERATOR_CD_BOT_SSH }}
        run: |
          set -euEo pipefail
          shopt -s inherit_errexit

          if [[ -z "${CLUSTER_KUBECONFIG}" ]]; then
            echo '::error::OPENSHIFT_CERTIFICATION_CLUSTER_KUBECONFIG must not be empty.'
            exit 1
          fi

          if [[ -z "${CD_BOT_SSH_KEY}" ]]; then
            echo '::error::SCYLLADB_OPERATOR_CD_BOT_SSH must not be empty.'
            exit 1
          fi

          kubeconfig="${RUNNER_TEMP}/certification-cluster-kubeconfig"
          ssh_key="${RUNNER_TEMP}/cd-bot-ssh-key"
          ( umask 077; printf '%s\n' "${CLUSTER_KUBECONFIG}" > "${kubeconfig}"; printf '%s\n' "${CD_BOT_SSH_KEY}" > "${ssh_key}" )
          echo "kubeconfig=${kubeconfig}" >> "${GITHUB_OUTPUT}"
          echo "ssh-key=${ssh_key}" >> "${GITHUB_OUTPUT}"

      - name: Certify the bundle
        env:
          TAG: ${{ inputs.tag }}
          SUBMIT: ${{ inputs.submit == true }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          KUBECONFIG: ${{ steps.credentials.outputs.kubeconfig }}
          SSH_KEY: ${{ steps.credentials.outputs.ssh-key }}
        # The script takes the bundle from the working directory, which is the release checkout.
        working-directory: release
        run: ../tooling/hack/.ci/olm/certify-bundle.sh "${TAG}" "${SSH_KEY}"
