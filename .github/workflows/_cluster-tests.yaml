name: Cluster tests

# Every test running a build of the operator on a cluster, defined once for all the workflows that run them: the e2e
# suites on kind, GKE, OKE and OpenShift, and the OpenShift preflight checks of the OLM bundle. Runs the selected tests
# against the caller's operator image, and the OLM bundle and catalog deploying it for the tests that need them. The
# callers select the tests by their ids.
on:
  workflow_call:
    inputs:
      image-ref:
        description: Digest-pinned reference to the operator image to test, as `_image.yaml` outputs it.
        required: true
        type: string
      olm-bundle-image-ref:
        description: Digest-pinned reference to the OLM bundle of the operator image, as `_olm.yaml` outputs it.
        required: true
        type: string
      olm-catalog-image-ref:
        description: >-
          Digest-pinned reference to the OLM catalog serving a bundle of the operator image, as `_olm.yaml` outputs it.
        required: true
        type: string
      tests:
        description: >-
          JSON list of glob patterns matching the ids of the tests to run, e.g. `["gke-parallel"]`, or `["!oke-*"]` for
          every test but OKE ones, as `hack/.ci/select-jobs.sh` matches them. Runs every test when omitted.
        required: false
        type: string
    secrets:
      ci-provisioners-kubeconfig:
        description: Kubeconfig of the cluster to create the CI provisioning objects in.
        required: true

permissions:
  contents: read

jobs:
  # A matrix creates checks only for the jobs selected, where jobs gated by `if` would all show up, the unselected ones
  # as skipped. Every entry carries every input of the workflow it calls, because a key missing from an entry passes an
  # empty value rather than the input's default, so the defaults below have to match those of the workflows they call.
  plan:
    runs-on: hosted-runners-standard-pool
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      gke: ${{ steps.plan.outputs.gke }}
      oke: ${{ steps.plan.outputs.oke }}
      openshift: ${{ steps.plan.outputs.openshift }}
      openshift-preflight: ${{ steps.plan.outputs.openshift-preflight }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - id: plan
      shell: bash
      env:
        TESTS: ${{ inputs.tests }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        kind_defaults='{
          "scylladb-image-ref": "",
          "enable-parallel-node-operations": "",
          "parallelism": 0,
          "e2e-timeout": "90m"
        }'
        # The old node-exporter bundling within the ScyllaDB container (before 2026.3) is verified for as long as we
        # support <2026.3.
        kind='[
          {
            "id": "kind-fast",
            "suite": "kind-fast"
          },
          {
            "id": "kind-scylladb-monitoring-old-node-exporter",
            "suite": "kind-scylladb-monitoring",
            "scylladb-image-ref": "docker.io/scylladb/scylla:2026.2.6"
          },
          {
            "id": "kind-cluster-topology-sequential",
            "suite": "kind-cluster-topology",
            "enable-parallel-node-operations": "false"
          }
        ]'
        gke_defaults='{
          "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke.yaml",
          "object-storage": false,
          "storageclass-name": "scylladb-local-xfs",
          "nodeconfig-path": "./hack/.ci/manifests/cluster/nodeconfig.yaml",
          "node-service-type": "Headless",
          "nodes-broadcast-address-type": "PodIP",
          "clients-broadcast-address-type": "PodIP"
        }'
        # The serial jobs run without a NodeConfig, so without a local storage class either, and ScyllaDB storage falls
        # back to the cluster default.
        gke='[
          {
            "id": "gke-parallel",
            "suite": "scylla-operator/conformance/parallel",
            "object-storage": true
          },
          {
            "id": "gke-parallel-clusterip",
            "suite": "scylla-operator/conformance/parallel",
            "object-storage": true,
            "node-service-type": "ClusterIP",
            "nodes-broadcast-address-type": "ServiceClusterIP",
            "clients-broadcast-address-type": "ServiceClusterIP"
          },
          {
            "id": "gke-serial",
            "suite": "scylla-operator/conformance/serial",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke-serial.yaml",
            "nodeconfig-path": "",
            "storageclass-name": ""
          },
          {
            "id": "gke-arm64-parallel",
            "suite": "scylla-operator/conformance/parallel",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke-arm64.yaml",
            "object-storage": true,
            "nodeconfig-path": "./hack/.ci/manifests/cluster/nodeconfig-gke-arm64.yaml"
          },
          {
            "id": "gke-arm64-serial",
            "suite": "scylla-operator/conformance/serial",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke-arm64-serial.yaml",
            "nodeconfig-path": "",
            "storageclass-name": ""
          },
          {
            "id": "gke-multi-dc-parallel",
            "suite": "scylla-operator/conformance/multi-datacenter-parallel",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke-multi-dc.yaml",
            "object-storage": true
          }
        ]'
        oke='[
          {
            "id": "oke-parallel",
            "suite": "scylla-operator/conformance/parallel"
          },
          {
            "id": "oke-serial",
            "suite": "scylla-operator/conformance/serial"
          }
        ]'
        openshift_defaults='{
          "cluster-manifest": "./hack/.ci/manifests/ci-clusters/openshift-aws.yaml",
          "object-storage": false,
          "storageclass-name": "scylladb-local-xfs",
          "nodeconfig-path": "./hack/.ci/manifests/cluster/nodeconfig-openshift-aws.yaml"
        }'
        openshift='[
          {
            "id": "openshift-aws-parallel",
            "suite": "scylla-operator/conformance/parallel/openshift",
            "object-storage": true
          },
          {
            "id": "openshift-aws-serial",
            "suite": "scylla-operator/conformance/serial",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/openshift-aws-serial.yaml",
            "nodeconfig-path": "",
            "storageclass-name": ""
          }
        ]'
        openshift_preflight='[
          {
            "id": "openshift-preflight"
          }
        ]'

        mapfile -t ids < <( jq -sr 'add | .[].id' <<< "${kind} ${gke} ${oke} ${openshift} ${openshift_preflight}" )
        SELECTED="$( ./hack/.ci/select-jobs.sh "${TESTS:-[\"*\"]}" "${ids[@]}" )"
        export SELECTED
        select='(env.SELECTED | fromjson) as $jobs | map(select(.id | IN($jobs[])))'
        {
          echo "kind=$( jq -c --argjson defaults "${kind_defaults}" "${select} | map(\$defaults + .)" <<< "${kind}" )"
          echo "gke=$( jq -c --argjson defaults "${gke_defaults}" "${select} | map(\$defaults + .)" <<< "${gke}" )"
          echo "oke=$( jq -c "${select}" <<< "${oke}" )"
          echo "openshift=$( jq -c --argjson defaults "${openshift_defaults}" "${select} | map(\$defaults + .)" <<< "${openshift}" )"
          echo "openshift-preflight=$( jq -c "${select}" <<< "${openshift_preflight}" )"
        } >> "${GITHUB_OUTPUT}"

  kind:
    needs: plan
    # An empty matrix is an error.
    if: needs.plan.outputs.kind != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.kind) }}
    name: ${{ matrix.id }}
    uses: ./.github/workflows/_e2e-kind.yaml
    with:
      name: e2e-${{ matrix.id }}
      image-ref: ${{ inputs.image-ref }}
      suite: ${{ matrix.suite }}
      scylladb-image-ref: ${{ matrix.scylladb-image-ref }}
      enable-parallel-node-operations: ${{ matrix.enable-parallel-node-operations }}
      parallelism: ${{ matrix.parallelism }}
      e2e-timeout: ${{ matrix.e2e-timeout }}

  gke:
    needs: plan
    # An empty matrix is an error.
    if: needs.plan.outputs.gke != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gke) }}
    name: ${{ matrix.id }}
    uses: ./.github/workflows/_e2e-gke.yaml
    with:
      name: e2e-${{ matrix.id }}
      image-ref: ${{ inputs.image-ref }}
      suite: ${{ matrix.suite }}
      cluster-manifest: ${{ matrix.cluster-manifest }}
      object-storage: ${{ matrix.object-storage }}
      storageclass-name: ${{ matrix.storageclass-name }}
      nodeconfig-path: ${{ matrix.nodeconfig-path }}
      node-service-type: ${{ matrix.node-service-type }}
      nodes-broadcast-address-type: ${{ matrix.nodes-broadcast-address-type }}
      clients-broadcast-address-type: ${{ matrix.clients-broadcast-address-type }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.ci-provisioners-kubeconfig }}

  oke:
    needs: plan
    # An empty matrix is an error.
    if: needs.plan.outputs.oke != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.oke) }}
    name: ${{ matrix.id }}
    uses: ./.github/workflows/_e2e-oke.yaml
    with:
      name: e2e-${{ matrix.id }}
      image-ref: ${{ inputs.image-ref }}
      suite: ${{ matrix.suite }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.ci-provisioners-kubeconfig }}

  openshift:
    needs: plan
    # An empty matrix is an error.
    if: needs.plan.outputs.openshift != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.openshift) }}
    name: ${{ matrix.id }}
    uses: ./.github/workflows/_e2e-openshift-aws.yaml
    with:
      name: e2e-${{ matrix.id }}
      image-ref: ${{ inputs.image-ref }}
      olm-catalog-image-ref: ${{ inputs.olm-catalog-image-ref }}
      suite: ${{ matrix.suite }}
      cluster-manifest: ${{ matrix.cluster-manifest }}
      object-storage: ${{ matrix.object-storage }}
      storageclass-name: ${{ matrix.storageclass-name }}
      nodeconfig-path: ${{ matrix.nodeconfig-path }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.ci-provisioners-kubeconfig }}

  # Checks the bundle against Red Hat's certification requirements, without submitting the results.
  openshift-preflight:
    needs: plan
    # An empty matrix is an error.
    if: needs.plan.outputs.openshift-preflight != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.openshift-preflight) }}
    name: ${{ matrix.id }}
    uses: ./.github/workflows/_openshift-preflight.yaml
    with:
      name: ${{ matrix.id }}
      olm-bundle-image-ref: ${{ inputs.olm-bundle-image-ref }}
      olm-catalog-image-ref: ${{ inputs.olm-catalog-image-ref }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.ci-provisioners-kubeconfig }}
