name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_checks.yaml

  detect-source-changes:
    name: detect-source-changes
    runs-on: hosted-runners-standard-pool
    # The action reads the PR's changed files from the GitHub API, so there is no checkout to make.
    permissions:
      pull-requests: read
    outputs:
      source-changed: ${{ steps.source-change-detection.outputs.source }}
    steps:
      - name: Detect source changes
        id: source-change-detection
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # With 'every', a changed file counts only when it matches all rules, i.e. escapes every exclusion.
          predicate-quantifier: every
          filters: |
            source:
              - '!CODEOWNERS'
              - '!docs/**'
              - '!enhancements/**'
              - '!**/*.md'
              - '!renovate.json'

  # On a PR from a fork this fails for lack of secrets, and so do the jobs needing it, rather than the tests being
  # skipped and counted as passed. Skipping it on a change of no source skips the tests with it.
  image:
    needs: detect-source-changes
    if: needs.detect-source-changes.outputs.source-changed == 'true'
    uses: ./.github/workflows/_image.yaml
    with:
      image-tag: scylla-operator-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  # Fails the PR on a bundle or catalog that doesn't build.
  olm:
    needs: image
    uses: ./.github/workflows/_olm.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      bundle-image-tag: scylla-operator-bundle-${{ github.run_id }}
      catalog-image-tag: scylla-operator-catalog-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  tests:
    needs:
    - image
    - olm
    uses: ./.github/workflows/_cluster-tests.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      olm-bundle-image-ref: ${{ needs.olm.outputs.bundle-ref }}
      olm-catalog-image-ref: ${{ needs.olm.outputs.catalog-ref }}
      tests: '["kind-*", "gke-parallel", "gke-parallel-clusterip", "gke-serial"]'
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}

  verify-commits:
    name: verify-commits
    runs-on: hosted-runners-standard-pool
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Without this, the checkout is refs/pull/N/merge, GitHub's test merge of the PR into the
          # base branch, so HEAD is a merge commit that the contributor never wrote.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify commit messages
        run: ./hack/.ci/verify-commits.sh "${{ github.event.pull_request.base.sha }}"

  # The merge automation gates on a fixed set of contexts it is configured with, so individual GitHub Actions
  # checks are invisible to it. This aggregate is the single context it can be told to require once these jobs
  # have matured, which keeps wiring further jobs into the merge gate a one-line change here.
  check-required:
    runs-on: hosted-runners-standard-pool
    needs:
    - checks
    - detect-source-changes
    - image
    - olm
    - tests
    - verify-commits
    if: always()
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo "Some jobs failed or were cancelled."
        exit 1
