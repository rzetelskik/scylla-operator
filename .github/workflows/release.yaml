name: Release

# Releases the dispatched ref as the given version. Builds the operator image, gates it on the e2e suites, pushes the
# version tag, publishes the image to the production repositories and creates the GitHub release, in that order: the
# tag is the output of the gate, not its trigger, and nothing is published for a version without one. Lives on every
# release branch and is dispatched on the branch being released.
#
# Version tags are immutable, so a release that failed after its tag is finished by dispatching it again with the same
# version. The tag records the image the gate tested, and the run publishes that image instead of building and gating
# a new one, whose digest would differ. The publishing steps are safe to repeat.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the `v` prefix, e.g. `1.23.0` or `1.23.0-rc.0`.
        required: true
        type: string

# One release at a time across all branches. Which rolling tags a version gets depends on the tags released before
# it, so two releases in flight could both decide they're the latest. GitHub keeps one more run pending, so a third
# dispatch cancels the pending one rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # Where `_image.yaml` publishes the image. The tag records only its digest, which is the same in every repository the
  # image is copied to.
  DEV_IMAGE_REPO_REF: quay.io/scylladb-dev/ci

jobs:
  # Rejects a malformed version before the hours the gate takes, decides what the release publishes, and for a version
  # that already has its tag, reads the tested image from it.
  parse-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      tag-exists: ${{ steps.parse.outputs.tag-exists }}
      image-digest: ${{ steps.parse.outputs.image-digest }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      latest: ${{ steps.parse.outputs.latest }}
      image-tags: ${{ steps.parse.outputs.image-tags }}
    steps:
    # `X.Y` follows the highest GA patch of its minor and `latest` the highest GA overall, so a patch of an older minor
    # can't move `latest` backwards. Prereleases get neither.
    - name: Parse the version
      id: parse
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ inputs.version }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        readonly semver_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
        if [[ ! "${VERSION}" =~ ${semver_pattern} ]]; then
          echo "::error::Version '${VERSION}' is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-PRERELEASE."
          exit 1
        fi
        prerelease="$( [[ -n "${BASH_REMATCH[1]}" ]] && echo true || echo false )"

        tag="v${VERSION}"
        released_tags="$( git ls-remote --tags --refs "${REPO_URL}" 'v*' | sed -e 's#.*refs/tags/##' )"
        tag_exists=false
        image_digest=''
        if grep -qxF "${tag}" <<< "${released_tags}"; then
          tag_exists=true
          # The tag job writes the digest of the tested image into the annotation as an `Image-Digest:` trailer. A tag
          # without one wasn't made by this workflow, so nothing records that it passed the gate.
          tag_object="$( gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object | select(.type == "tag") | .sha' )"
          if [[ -n "${tag_object}" ]]; then
            image_digest="$( gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .message | sed -n -e 's/^Image-Digest: //p' )"
          fi
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Tag '${tag}' records no tested image, so it wasn't created by this workflow."
            exit 1
          fi
        fi

        image_tags=( "${VERSION}" )
        latest=false
        if [[ "${prerelease}" == "false" ]]; then
          ga_tags="$( { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "${released_tags}" || true; echo "${tag}"; } | sort --version-sort --unique )"
          minor="${VERSION%.*}"
          if [[ "$( grep -F "v${minor}." <<< "${ga_tags}" | tail -n 1 )" == "${tag}" ]]; then
            image_tags+=( "${minor}" )
          fi
          if [[ "$( tail -n 1 <<< "${ga_tags}" )" == "${tag}" ]]; then
            image_tags+=( "latest" )
            latest=true
          fi
        fi

        {
          echo "tag=${tag}"
          echo "tag-exists=${tag_exists}"
          echo "image-digest=${image_digest}"
          echo "prerelease=${prerelease}"
          echo "latest=${latest}"
          echo "image-tags=$( printf '%s\n' "${image_tags[@]}" | jq -Rnc '[inputs]' )"
        } >> "${GITHUB_OUTPUT}"

  # A version that already has its tag passed the gate, so the run skips straight to publishing what the tag records.
  # Skipping the image skips everything up to the tag with it.
  image:
    needs: parse-version
    if: needs.parse-version.outputs.tag-exists == 'false'
    uses: ./.github/workflows/_image.yaml
    with:
      image-tag: scylla-operator-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  olm:
    needs: image
    uses: ./.github/workflows/_olm.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      bundle-image-tag: scylla-operator-bundle-${{ github.run_id }}
      catalog-image-tag: scylla-operator-catalog-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  e2e:
    needs:
      - image
      - olm
    uses: ./.github/workflows/_e2e-jobs.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      olm-catalog-image-ref: ${{ needs.olm.outputs.catalog-ref }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}

  # Checks the bundle against Red Hat's certification requirements ahead of a release, without submitting the results.
  openshift-preflight:
    needs: olm
    uses: ./.github/workflows/_openshift-preflight.yaml
    with:
      name: openshift-preflight
      olm-bundle-image-ref: ${{ needs.olm.outputs.bundle-ref }}
      olm-catalog-image-ref: ${{ needs.olm.outputs.catalog-ref }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}

  # Creating the version tag relies on GitHub Actions being a bypass actor of the version tag ruleset.
  tag:
    needs:
    - parse-version
    - image
    - e2e
    - openshift-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - name: Push the tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.parse-version.outputs.tag }}
        IMAGE_REF: ${{ needs.image.outputs.image-ref }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        # A redispatch of this version reads the trailer to publish the tested image.
        message="$( printf '%s\n\nImage-Digest: %s' "${TAG}" "${IMAGE_REF#*@}" )"
        tag_object_sha="$( gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
        --raw-field tag="${TAG}" \
        --raw-field message="${message}" \
        --raw-field object="${GITHUB_SHA}" \
        --raw-field type=commit \
        --jq .sha )"
        gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
        --raw-field ref="refs/tags/${TAG}" \
        --raw-field sha="${tag_object_sha}"

  # Copies the image the gate ran against, so what was tested is what ships. Runs on a redispatch too, where the jobs
  # it needs are skipped.
  promote:
    needs:
    - parse-version
    - image
    - tag
    if: ${{ !cancelled() && !failure() && (needs.parse-version.outputs.tag-exists == 'true' || needs.tag.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        image-repo-ref:
        - quay.io/scylladb/scylla-operator
        - docker.io/scylladb/scylla-operator
    name: promote (${{ matrix.image-repo-ref }})
    runs-on: ubuntu-latest
    container:
      image: quay.io/scylladb/scylla-operator-images:kube-tools
    timeout-minutes: 30
    steps:
    # skopeo reads one auth file, so the per-registry secrets are merged into it.
    - name: Write registry auth file
      env:
        QUAY_AUTH_JSON: ${{ secrets.QUAY_SCYLLADB_PUBLISHER_CREDS }}
        DOCKERHUB_AUTH_JSON: ${{ secrets.DOCKERHUB_SCYLLADB_PUBLISHER_CREDS }}
      run: |
        set -euo pipefail
        shopt -s inherit_errexit

        umask 077
        jq -n '[env.QUAY_AUTH_JSON, env.DOCKERHUB_AUTH_JSON | fromjson | .auths] | {auths: add}' > "${RUNNER_TEMP}/auth.json"
        echo "REGISTRY_AUTH_FILE=${RUNNER_TEMP}/auth.json" >> "${GITHUB_ENV}"

    # The version tag must never point at a different image than the one released under it, so an existing one has to
    # hold the tested digest already. --preserve-digests fails the copy rather than letting skopeo rewrite a manifest
    # into a different digest.
    - name: Copy the image
      env:
        SOURCE_IMAGE_REF: ${{ needs.image.outputs.image-ref || format('{0}@{1}', env.DEV_IMAGE_REPO_REF, needs.parse-version.outputs.image-digest) }}
        IMAGE_REPO_REF: ${{ matrix.image-repo-ref }}
        VERSION: ${{ inputs.version }}
        IMAGE_TAGS: ${{ needs.parse-version.outputs.image-tags }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        # Listed outside the condition, so a failure to list fails the job rather than skipping the check.
        tags="$( skopeo list-tags "docker://${IMAGE_REPO_REF}" )"
        if jq -e --arg version "${VERSION}" 'any(.Tags[]; . == $version)' <<< "${tags}"; then
          digest="sha256:$( skopeo inspect --raw "docker://${IMAGE_REPO_REF}:${VERSION}" | sha256sum | cut -d ' ' -f 1 )"
          if [[ "${digest}" != "${SOURCE_IMAGE_REF#*@}" ]]; then
            echo "::error::${IMAGE_REPO_REF}:${VERSION} already holds ${digest}, not the tested ${SOURCE_IMAGE_REF#*@}."
            exit 1
          fi
        fi

        for image_tag in $( jq -r '.[]' <<< "${IMAGE_TAGS}" ); do
          skopeo copy --all --preserve-digests "docker://${SOURCE_IMAGE_REF}" "docker://${IMAGE_REPO_REF}:${image_tag}"
        done

  github-release:
    needs:
    - parse-version
    - promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    # Prereleases link to the top of the changelog, since their section doesn't exist yet. The anchor of a version's
    # section is the version without dots, e.g. 1201 for 1.20.1.
    - name: Create the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ inputs.version }}
        TAG: ${{ needs.parse-version.outputs.tag }}
        PRERELEASE: ${{ needs.parse-version.outputs.prerelease }}
        LATEST: ${{ needs.parse-version.outputs.latest }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        # A release that exists may have been edited since, so a redispatch leaves it as it is.
        if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null; then
          echo "::notice::Release '${TAG}' already exists, leaving it unchanged."
          exit 0
        fi

        changelog_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md"
        if [[ "${PRERELEASE}" == "false" ]]; then
          changelog_url+="#${VERSION//./}"
        fi
        notes_file="${RUNNER_TEMP}/notes.md"
        printf '## Docker Image\n\n```\ndocker.io/scylladb/scylla-operator:%s\n```\n\n## Changelog\n\n%s\n' "${VERSION}" "${changelog_url}" > "${notes_file}"

        gh release create "${TAG}" \
        --repo "${GITHUB_REPOSITORY}" \
        --verify-tag \
        --title "${TAG}" \
        --notes-file "${notes_file}" \
        --prerelease="${PRERELEASE}" \
        --latest="${LATEST}"
